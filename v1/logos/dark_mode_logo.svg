<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="sunsetGradDark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <clipPath id="darkBottom">
      <polygon points="0 46, 100 26, 100 100, 0 100" />
    </clipPath>
    <clipPath id="darkTop">
      <polygon points="0 0, 100 0, 100 20, 0 40" />
    </clipPath>
  </defs>
  
  <!-- Deep Black App Icon Background -->
  <rect x="0" y="0" width="100" height="100" rx="22" fill="#050505" />
  
  <!-- Top Empty Buffer (Inverted to White for dark mode contrast) -->
  <rect x="30" y="10" width="40" height="80" rx="20" fill="none" stroke="#FFFFFF" stroke-width="4" clip-path="url(#darkTop)" />
  
  <!-- Bottom Solid (Sunset Gradient) -->
  <rect x="30" y="10" width="40" height="80" rx="20" fill="url(#sunsetGradDark)" clip-path="url(#darkBottom)" />
  
  <!-- Laser Threshold (Brightened slightly to #F43F5E to pop against black) -->
  <line x1="24" y1="38.2" x2="76" y2="27.8" stroke="#F43F5E" stroke-width="2.5" stroke-linecap="round" />
</svg>
